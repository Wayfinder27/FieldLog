:root{
  --soil-bg: #E9E2D0;
  --soil-bg-2: #DED4BC;
  --vine-dark: #24392C;
  --vine-mid: #3E5541;
  --olive: #5B6B45;
  --plum: #6B2737;
  --plum-dark: #4E1C29;
  --gold: #B98B2A;
  --ink: #2A2621;
  --ink-soft: #5C564B;
  --card-bg: #F5F0E4;
  --line: rgba(42,38,33,0.14);
  --ok: #4C6B3F;
  --warn: #B98B2A;
  --stale: #A15239;
  --none: #9B9482;
  --radius: 4px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--soil-bg);
  background-image:
    repeating-linear-gradient(90deg, rgba(42,38,33,0.025) 0px, rgba(42,38,33,0.025) 1px, transparent 1px, transparent 34px);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

.wrap{ max-width: 1040px; margin: 0 auto; padding: 28px 20px 80px; }

header.top{
  display:flex; flex-direction:column; gap:4px;
  padding-bottom: 20px; margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color: var(--olive); font-weight:500;
}
h1{
  font-family:'Fraunces', serif; font-weight:700; font-size: 32px;
  margin: 2px 0 4px; color: var(--vine-dark); letter-spacing:-0.01em;
}
.sub{ color: var(--ink-soft); font-size: 14px; }
.sync-line{
  display:flex; align-items:center; gap:6px; margin-top:4px;
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--ink-soft);
}
.sync-line .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; background: var(--none); }
.sync-line.ok .dot{ background: var(--ok); }
.sync-line.warn .dot{ background: var(--warn); }
.sync-line.stale .dot{ background: var(--stale); }
.sync-line.syncing .dot{ background: var(--olive); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

.toolbar{
  display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;
}
.search{
  flex:1; min-width:180px;
  padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--card-bg);
  font-family:'Inter'; font-size:14px; color:var(--ink);
}
.search:focus{ outline:2px solid var(--olive); outline-offset:1px; }

.tool-btn{
  font-family:'Inter'; font-weight:600; font-size:12.5px; color:var(--vine-dark);
  background: var(--card-bg); border:1px solid var(--line); padding:9px 13px;
  border-radius: var(--radius); cursor:pointer; white-space:nowrap;
}
.tool-btn:hover{ border-color: var(--olive); }
.tool-btn.primary{ background: var(--vine-dark); color:#F5F0E4; border-color:var(--vine-dark); }
.tool-btn.primary:hover{ background: var(--vine-mid); }
.tool-btn.accent{ background: var(--plum); color:#F5F0E4; border-color:var(--plum); }
.tool-btn.accent:hover{ background: var(--plum-dark); }

.legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; width:100%; margin-top:2px; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

.grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
  gap:10px;
}

.block-card{
  position:relative; background: var(--card-bg);
  border:1px solid var(--line); border-radius: var(--radius);
  padding:12px 12px 10px; cursor:pointer; text-align:left;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  overflow:hidden;
}
.block-card::before{
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(180deg, transparent 0 6px, rgba(36,57,44,0.035) 6px 7px);
  pointer-events:none;
}
.block-card:hover{ transform: translateY(-2px); box-shadow: 0 4px 14px rgba(36,57,44,0.12); border-color: var(--olive); }
.block-card:focus-visible{ outline:2px solid var(--vine-dark); outline-offset:2px; }

.block-id{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.block-name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--vine-dark); margin:2px 0 10px; line-height:1.15; }
.block-meta{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
.block-meta .dot{ flex-shrink:0; }

/* Modals */
.overlay{
  position:fixed; inset:0; background:rgba(36,45,32,0.45);
  display:none; align-items:flex-start; justify-content:center;
  padding: 30px 16px; overflow-y:auto; z-index:100;
  backdrop-filter: blur(2px);
}
.overlay.open{ display:flex; }
.modal{
  background: var(--card-bg); border-radius: 6px; width:100%; max-width:560px;
  border:1px solid var(--line); box-shadow: 0 18px 50px rgba(36,45,32,0.3);
  animation: rise .18s ease;
}
.modal.wide{ max-width: 820px; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.modal-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:20px 22px 14px; border-bottom:1px solid var(--line);
}
.modal-title-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.modal-id{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--olive); }
.modal-title-text{ font-family:'Fraunces',serif; font-weight:700; font-size:21px; color:var(--vine-dark); }
.modal-sub{ color:var(--ink-soft); font-size:12.5px; margin-top:4px; max-width:440px; }
.name-input{
  font-family:'Fraunces',serif; font-weight:700; font-size:21px; color:var(--vine-dark);
  border:none; background:transparent; border-bottom:1px dashed transparent; padding:0 2px;
  max-width:280px;
}
.name-input:hover, .name-input:focus{ border-bottom-color: var(--olive); outline:none; }
.close-btn{

<script>
const STORAGE_KEY = 'vineyard-blocks';

/* ============================================================
   CONFIG — incolla qui l'URL del tuo Web App (Apps Script) e il
   SECRET_TOKEN che hai scelto in Code.gs. Finché API_URL resta
   vuota, l'app funziona solo in locale (localStorage), come prima.
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzWXeAvT7K7YsZQPDqUGoL4lHmWTjI2k5Z2QCSN6y6b7KHirM1ob8Ae0BdewYLhuGOJ/exec';
const API_TOKEN = 'Chardy27';    // stessa password messa in SECRET_TOKEN su Code.gs
const AUTO_SYNC_SECONDS = 25;    // ogni quanto ricontrolla in background se ci sono novità
/* ============================================================ */

const TABS = [
  {id:'attivita', label:'Activity'},
  {id:'fenologia', label:'Phenology'}
];
const MULTI_TABS = [
  {id:'attivita', label:'Activity'}
];
const ATTIVITA_TIPI = ['Bunch Thinning','Harvest','Irrigation','Leaf Plucking','Maintenance','Mowing','Nutrition','Pruning','Shoot Thinning','Spraying','Wire Lifting'];
const PRUNING_SUBTASKS = ['Cutting','Pulling','Wrapping'];

   multi:true -> checkboxes (tick any that apply). multi:false -> radio (pick one). */
const ACTIVITY_SUBTASKS = {
  'Pruning':   { options: PRUNING_SUBTASKS, multi: true,  label: 'Pruning tasks (tick any that apply)' },
  'Nutrition': { options: NUTRIZIONE_METODI, multi: false, label: 'Nutrition method (pick one)' }
};
const FENOLOGIA_STADI = [
  'E-L 1 – Winter bud',
  'E-L 2 – Bud scales opening',
  'E-L 3 – Woolly bud ± green showing',
  'E-L 4 – Budburst; leaf tips visible',
  'E-L 7 – First leaf separated from shoot tip',

  'E-L 11 – 4 leaves separated',
  'E-L 12 – 5 leaves separated; shoots ~10cm long; inflorescence clear',
  'E-L 13 – 6 leaves separated',
  'E-L 14 – 7 leaves separated',
  'E-L 15 – 8 leaves separated, shoot elongating rapidly; single flowers in compact groups',
  'E-L 16 – 10 leaves separated',
  'E-L 17 – 12 leaves separated; inflorescence well developed, single flowers separated',
  'E-L 18 – 14 leaves separated; flower caps still in place, colour fading from green',
  'E-L 19 – ~16 leaves separated; beginning of flowering (first caps loosening)',
  'E-L 20 – 10% caps off',

  'E-L 23 – 17-20 leaves separated; 50% caps off (= flowering)',

  'E-L 29 – Berries pepper-corn size (4mm); bunches tending downwards',
  'E-L 31 – Berries pea-size (7mm)',
  'E-L 32 – Beginning of bunch closure, berries touching',
  'E-L 33 – Berries still hard and green',
  'E-L 34 – Berries begin to soften; sugar starts increasing',
  'E-L 35 – Berries begin to colour and enlarge (veraison)',
  'E-L 36 – Berries with intermediate sugar values',
  'E-L 37 – Berries not quite ripe',
  'E-L 38 – Berries harvest-ripe',
  'E-L 39 – Berries over-ripe',
  'E-L 41 – After harvest; cane maturation complete',
  'E-L 43 – Beginning of leaf fall',
  'E-L 47 – End of leaf fall'
];

const MAP_BLOCKS = [
  {name:'FS1', variety:'Chardonnay GG', ha:0.53, rows:'1-14'},
  {name:'FS2', variety:'Chardonnay GG', ha:0.45, rows:'1-12'},
  {name:'FS3', variety:'Cabernet (Houghtons)', ha:0.69, rows:'15-32'},
  {name:'FS4', variety:'Cabernet (337/191)', ha:0.69, rows:'13-30'},
  {name:'FS5', variety:'Merlot', ha:0.78, rows:''},
  {name:'GR1', variety:'Chardonnay', ha:0.90, rows:''},
  {name:'GR2', variety:'Shiraz', ha:1.60, rows:''},
  {name:'NS1', variety:'Chardonnay', ha:0.55, rows:''},
  {name:'NS2', variety:'Chardonnay', ha:0.77, rows:''},
  {name:'NS3', variety:'Cabernet', ha:1.55, rows:''},
  {name:'CL1', variety:'Merlot 181', ha:0.73, rows:'1-44'},
  {name:'CL2', variety:'Cabernet Sauvignon (Roche 5/7)', ha:0.49, rows:'1-14'},
  {name:'CL3', variety:'Malbec (Alkoomi)', ha:1.02, rows:'15-44'},
  {name:'CL7', variety:'Cabernet Sauvignon (Roche 5/7)', ha:0.67, rows:'1-20'},
  {name:'CL8', variety:'Cabernet Franc (C24-11)', ha:0.99, rows:'21-49'},
  {name:'CL4', variety:'Chardonnay', ha:2.61, rows:''},
  {name:'CL9', variety:'Chardonnay', ha:2.21, rows:''},
  {name:'CL5', variety:'Cabernet Franc', ha:0.68, rows:''},
  {name:'CL10', variety:'Cabernet Franc', ha:0.6, rows:''},
  {name:'CL6', variety:'Malbec', ha:0.79, rows:''},
  {name:'CL11', variety:'Malbec', ha:0.58, rows:''},
  {name:'BE1 West', variety:'Chardonnay', ha:1.40, rows:''},
  {name:'BE1 East', variety:'Chardonnay', ha:1.00, rows:''},
  {name:'SS1', variety:'Sauvignon Blanc', ha:3.8, rows:'1-45'},
  {name:'SS2', variety:'Sauvignon Blanc', ha:3.65, rows:'46-90'},
  {name:'SS3', variety:'Semillon', ha:3.31, rows:'91-124'},
  {name:'OU1', variety:'Cabernet', ha:1.80, rows:''},
  {name:'CR1', variety:'Cabernet', ha:1.9, rows:'1-34'},
  {name:'CR2', variety:'Shiraz', ha:4.81, rows:'35-96'}
];
/* Fixed display order for the Field Log grid — applied at render time so it
   holds regardless of the order blocks happen to be stored in on the sheet. */
const BLOCK_ORDER = MAP_BLOCKS.map(b=>b.name);
const WHITE_VARIETIES = ['chardonnay','sauvignon blanc','semillon'];
function colorTypeFor(variety){
  const v = (variety||'').toLowerCase();
  return WHITE_VARIETIES.some(w=>v.includes(w)) ? 'white' : 'red';
}

let state = null;
let activeBlockId = null;
let activeTab = 'attivita';
let activeMultiTab = 'attivita';
let selectedMultiBlocks = new Set();
let logFilterBlock = 'all';
let logFilterCategory = 'all';
let activeSettingsTab = 'team';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  const blocks = MAP_BLOCKS.map((mb, idx) => ({
    id: idx+1, name: mb.name, variety: mb.variety, ha: mb.ha, rows: mb.rows,
    colorType: colorTypeFor(mb.variety), entries: []
  }));
  const workers = [
    {id:uid(), name:'Worker 1', type:'casual'},
    {id:uid(), name:'Worker 2', type:'casual'},
    {id:uid(), name:'Worker 3', type:'casual'},
    {id:uid(), name:'Worker 4', type:'casual'}
  ];
  return { blocks, workers, customTaskTypes: [] };
}

/* ============================================================
   SYNC ENGINE
   - Se API_URL è configurata: legge/scrive dal Google Sheet condiviso
     (via Apps Script), con una cache locale di riserva per l'offline.
   - Se API_URL è vuota: si comporta come prima, solo localStorage
     sul singolo dispositivo (nessuna sincronizzazione).
   ============================================================ */
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage);
const apiConfigured = !!API_URL;
const LOCAL_CACHE_KEY = STORAGE_KEY + '-cache';
const LOCAL_PENDING_KEY = STORAGE_KEY + '-pending';
let lastSyncedAt = null;
let pendingPush = false;
let syncInFlight = false;
let autoSyncTimer = null;

async function apiGet(key){
  const url = `${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`;
  const res = await fetch(url, { method:'GET' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data; // { key, value, updatedAt }
}
async function apiSet(key, value){
  const res = await fetch(API_URL, {
    method:'POST',
    headers: { 'Content-Type':'text/plain;charset=utf-8' }, // evita preflight CORS
    body: JSON.stringify({ token: API_TOKEN, key, value })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function storageGet(key){
  if(hasClaudeStorage) return await window.storage.get(key);
  const v = localStorage.getItem(key);
  return v ? { key, value: v } : null;
}
async function storageSet(key, value){
  if(hasClaudeStorage) return await window.storage.set(key, value);
  localStorage.setItem(key, value);
  return { key, value };
}

function setSyncLine(mode, text){
  const el = document.getElementById('syncLine');
  if(!el) return;
  el.className = 'sync-line' + (mode ? ' '+mode : '');
  el.innerHTML = `<span class="dot"></span>${text}`;
}
function syncAgoText(){
  if(!lastSyncedAt) return 'never synced';
  const diffMin = Math.round((Date.now() - lastSyncedAt.getTime())/60000);
  if(diffMin < 1) return 'synced just now';
  if(diffMin === 1) return 'synced 1 min ago';
  return `synced ${diffMin} min ago`;
}
function refreshSyncLine(){
  if(!apiConfigured){ setSyncLine('', 'local only — no shared backend configured'); return; }
  if(syncInFlight){ setSyncLine('syncing', 'syncing…'); return; }
  if(pendingPush){ setSyncLine('warn', `changes saved locally, not yet synced (${syncAgoText()})`); return; }
  if(!lastSyncedAt){ setSyncLine('stale', 'not synced yet'); return; }
  const diffMin = (Date.now() - lastSyncedAt.getTime())/60000;
  setSyncLine(diffMin < 3 ? 'ok' : 'warn', syncAgoText());
}

function normalizeState(s){
  if(!s.workers) s.workers = defaultState().workers;
  if(!s.customTaskTypes) s.customTaskTypes = [];
  migrateBlockRename(s);
  return s;
}

/* One-time-safe migration: merges CR2A+CR2B into CR2, splits BE1 into
   BE1 East / BE1 West. Safe to run on every load — does nothing once
   the block list already matches the new shape. */
function migrateBlockRename(s){
  if(!s.blocks) return;
  const a = s.blocks.find(b=>b.name==='CR2A');
  const bB = s.blocks.find(b=>b.name==='CR2B');
  if(a && bB){
    a.name = 'CR2';
    a.ha = +((a.ha||0) + (bB.ha||0)).toFixed(2);
    a.rows = '35-96';
    a.entries = (a.entries||[]).concat(bB.entries||[]);
    s.blocks = s.blocks.filter(b=>b.name!=='CR2B');
  }
  const oldBe1 = s.blocks.find(b=>b.name==='BE1');
  if(oldBe1){
    oldBe1.name = 'BE1 West';
    oldBe1.ha = 1.40;
    const maxId = Math.max(0, ...s.blocks.map(b=>b.id||0));
    s.blocks.push({ id: maxId+1, name:'BE1 East', variety: oldBe1.variety, ha: 1.00, rows:'', colorType: oldBe1.colorType, entries: [] });
  }
}

async function loadState(){
  // 1. Always start from local cache so the app is instantly usable offline
  let localRaw = localStorage.getItem(LOCAL_CACHE_KEY) || localStorage.getItem(STORAGE_KEY);
  state = localRaw ? normalizeState(JSON.parse(localRaw)) : defaultState();
  pendingPush = localStorage.getItem(LOCAL_PENDING_KEY) === '1';

  if(apiConfigured){
    setSyncLine('syncing', 'connecting…');
    try{
      syncInFlight = true;
      const res = await apiGet(STORAGE_KEY);
      syncInFlight = false;
      if(res.value){
        // Server has data — if we don't have unsynced local edits, take server copy.
        if(!pendingPush){
          state = normalizeState(JSON.parse(res.value));
          localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
        }
        lastSyncedAt = new Date();
      } else if(!pendingPush) {
        // Nothing on server yet — seed it with our current (default) state
        await apiSet(STORAGE_KEY, JSON.stringify(state));
        lastSyncedAt = new Date();
      }
    }catch(e){
      syncInFlight = false;
      flashStatus('Offline — showing last saved copy');
    }
  }

  renderSubtitle();
  refreshSyncLine();
  renderGrid();
  startAutoSync();
}

function renderSubtitle(){
  const totHa = state.blocks.reduce((s,b)=>s+(b.ha||0),0);
  document.getElementById('subtitle').textContent = `${state.blocks.length} blocks · ${totHa.toFixed(1)} ha total · tap a block to log, or use Multi-Block for shared tasks`;
}

async function saveState(){
  // Save locally first — instant, works offline
  localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); // legacy key, harmless
  if(hasClaudeStorage){ try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  if(!apiConfigured){
    flashStatus('Saved (local device only)');
    return;
  }

  pendingPush = true;
  localStorage.setItem(LOCAL_PENDING_KEY, '1');
  refreshSyncLine();
  try{
    syncInFlight = true;
    refreshSyncLine();
    await apiSet(STORAGE_KEY, JSON.stringify(state));
    syncInFlight = false;
    pendingPush = false;
    lastSyncedAt = new Date();
    localStorage.removeItem(LOCAL_PENDING_KEY);
    flashStatus('Saved & synced');
  }catch(e){
    syncInFlight = false;
    flashStatus('Saved locally — will sync when back online');
  }
  refreshSyncLine();
}

/* Pull the latest from the shared sheet without discarding unsynced local work */
async function syncNow(showFeedback){
  if(!apiConfigured){ if(showFeedback) flashStatus('No shared backend configured yet'); return; }
  if(pendingPush){
    // Push our unsynced changes first rather than overwrite them
    await saveState();
    return;
  }
  syncInFlight = true; refreshSyncLine();
  try{
    const res = await apiGet(STORAGE_KEY);
    if(res.value){
      state = normalizeState(JSON.parse(res.value));
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
    }
    lastSyncedAt = new Date();
    renderSubtitle();
    renderGrid();
    if(showFeedback) flashStatus('Up to date');
  }catch(e){
    if(showFeedback) flashStatus('Could not reach the shared sheet — offline?');
  }
  syncInFlight = false;
  refreshSyncLine();
}

function startAutoSync(){
  if(!apiConfigured) return;
  clearInterval(autoSyncTimer);
  autoSyncTimer = setInterval(()=>{
    const anyModalOpen = document.querySelector('.overlay.open');
    if(!anyModalOpen) syncNow(false);
  }, AUTO_SYNC_SECONDS*1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') syncNow(false);
  });
  window.addEventListener('online', ()=> syncNow(false));
  setInterval(refreshSyncLine, 30000);
}

function lastEntryDate(block){
  if(!block.entries.length) return null;
  return block.entries.reduce((max,e)=> e.date > max ? e.date : max, block.entries[0].date);
}
function recencyStatus(dateStr){
  if(!dateStr) return {cls:'none', label:'No activity logged yet'};
  const days = Math.floor((new Date(todayISO()) - new Date(dateStr)) / 86400000);
  if(days < 4) return {cls:'ok', label:`Last entry: ${days===0?'today':days+'d ago'}`};
  if(days < 14) return {cls:'warn', label:`Last entry: ${days}d ago`};
  return {cls:'stale', label:`Last entry: ${days}d ago`};
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-AU', {day:'2-digit', month:'short', year:'numeric'});
}
function typeLabel(t){ return t==='contractor' ? 'Contractor' : t==='permanent' ? 'Permanent' : 'Casual'; }
function activityTypesList(context){
  let list = ATTIVITA_TIPI.concat(state.customTaskTypes||[]);
  if(context==='single') list = list.filter(t=>t!=='Irrigation');
  return list.slice().sort((a,b)=>a.localeCompare(b));
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const q = (document.getElementById('search').value||'').toLowerCase().trim();
  grid.innerHTML = '';
  state.blocks
    .filter(b => !q || b.name.toLowerCase().includes(q))
    .slice()
    .sort((a,c)=>{
      const ia = BLOCK_ORDER.indexOf(a.name), ic = BLOCK_ORDER.indexOf(c.name);
      if(ia===-1 && ic===-1) return a.name.localeCompare(c.name);
      if(ia===-1) return 1;
      if(ic===-1) return -1;
      return ia-ic;
    })
    .forEach(b=>{
      const last = lastEntryDate(b);
      const st = recencyStatus(last);
      const card = document.createElement('button');
      card.className = 'block-card';
      card.setAttribute('type','button');
      card.style.borderLeft = `4px solid ${b.colorType==='white' ? 'var(--gold)' : 'var(--plum)'}`;
      card.innerHTML = `
        <div class="block-id">${b.variety?escapeHtml(b.variety):''}${b.ha?` · ${b.ha} ha`:''}</div>
        <div class="block-name">${escapeHtml(b.name)}</div>
        <div class="block-meta"><span class="dot" style="background:var(--${st.cls})"></span>${st.label}</div>
      `;
      card.addEventListener('click', ()=> openBlock(b.id));
      grid.appendChild(card);
    });
}

function activitySubtaskHtml(prefix){

function wireActivitySubtaskToggle(prefix, selectId){
  const select = document.getElementById(selectId);
  const wrap = document.getElementById(`${prefix}-subtask-wrap`);
  const list = document.getElementById(`${prefix}-subtask-list`);
  const label = document.getElementById(`${prefix}-subtask-label`);
  if(!select || !wrap) return;
  const sync = ()=>{
    const cfg = ACTIVITY_SUBTASKS[select.value];
    if(!cfg){ wrap.style.display = 'none'; list.innerHTML = ''; return; }
    wrap.style.display = '';
    label.textContent = cfg.label;
    if(cfg.multi){
      list.innerHTML = cfg.options.map(t=>`
        <label class="worker-row"><input type="checkbox" class="${prefix}-subtask" value="${t}"><span class="w-name">${t}</span></label>
      `).join('');
    } else {
      list.innerHTML = cfg.options.map((t,i)=>`
        <label class="worker-row"><input type="radio" name="${prefix}-subtask-radio" class="${prefix}-subtask" value="${t}" ${i===0?'checked':''}><span class="w-name">${t}</span></label>
      `).join('');
    }
  };
  select.addEventListener('change', sync);
  sync();
}
function collectActivitySubtasks(prefix){
  return Array.from(document.querySelectorAll(`.${prefix}-subtask:checked`)).map(cb=>cb.value);
}

function workerListHtml(prefix){
  if(!state.workers.length) return `<div class="no-workers">No one on the team yet — add people via "⚙ Settings".</div>`;
  return `<div class="worker-list">${state.workers.map(w=>`
    <label class="worker-row">
      <input type="checkbox" class="${prefix}-check" data-id="${w.id}">
      <span class="w-name">${escapeHtml(w.name)} ${w.type && w.type!=='casual' ? `<span class="w-type-tag">· ${w.type}</span>` : ''}</span>
      <input type="number" class="${prefix}-ore" data-id="${w.id}" min="0" step="0.5" value="7" disabled>
    </label>
  `).join('')}</div>`;
}
function attachWorkerToggles(prefix){
  document.querySelectorAll(`.${prefix}-check`).forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const ore = document.querySelector(`.${prefix}-ore[data-id="${chk.dataset.id}"]`);
      ore.disabled = !chk.checked;
    });
  });
}
function collectWorkers(prefix){
  const workers = [];
  document.querySelectorAll(`.${prefix}-check:checked`).forEach(chk=>{
    const w = state.workers.find(x=>x.id===chk.dataset.id);
    const oreInput = document.querySelector(`.${prefix}-ore[data-id="${chk.dataset.id}"]`);
    if(w) workers.push({ name: w.name, type: w.type, ore: oreInput.value ? parseFloat(oreInput.value) : null });
  });
  return workers;
}

function entryMainLine(e){
  if(e.type==='attivita'){
    const w = (e.workers||[]).map(x=>`${escapeHtml(x.name)}${x.ore?` ${x.ore}h`:''}`).join(', ');
    const subtasks = e.subtasks || e.pruningTasks; // pruningTasks kept for backward-compat with older entries
    const sub = subtasks && subtasks.length ? ` (${subtasks.join(', ')})` : '';
    return `${e.tipo}${sub}${w?` · ${w}`:''}`;
  } else {
    return `${e.stadio}${e.osservatoDa?` · obs. ${escapeHtml(e.osservatoDa)}`:''}`;
  }
}

function renderHistList(container, entries){
  if(!entries.length){ container.innerHTML = `<div class="empty-hist">No entries logged yet.</div>`; return; }
  container.innerHTML = '';
  entries.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'entry';
    let splitLine = '';
    if(e.split){
      splitLine = `<div class="entry-split">split across ${e.split.blockNames.length} blocks — ${e.split.blockHa||'?'} of ${e.split.totalHa} ha (${e.split.sharePct}%)</div>`;
    }
    row.innerHTML = `
      <div class="entry-main">
        <span class="entry-date">${formatDate(e.date)}</span> — ${entryMainLine(e)}
        ${e.note?`<div class="entry-note">${escapeHtml(e.note)}</div>`:''}
        ${splitLine}
      </div>
      <button class="entry-del" title="Delete entry" aria-label="Delete entry">🗑</button>
    `;
    row.querySelector('.entry-del').addEventListener('click', ()=> deleteEntry(e.id));
    container.appendChild(row);
  });
}

function saveEntry(){
  const b = getBlock();
  const date = document.getElementById('f-date').value || todayISO();
  const note = (document.getElementById('f-note')?.value || '').trim();
  let entry = { id: uid(), type: activeTab, date, note };
  if(activeTab==='attivita'){
    entry.tipo = document.getElementById('f-tipo').value;
    entry.workers = collectWorkers('w');
    if(ACTIVITY_SUBTASKS[entry.tipo]){
      const subtasks = collectActivitySubtasks('f');
      if(subtasks.length) entry.subtasks = subtasks;
    }
  } else {
    entry.stadio = document.getElementById('f-stadio').value;
    entry.osservatoDa = document.getElementById('f-osservato').value.trim();
  }
  b.entries.push(entry);
  saveState(); renderPanel(); renderGrid();
}
function deleteEntry(entryId){
  const b = getBlock();
  b.entries = b.entries.filter(e=>e.id!==entryId);
  saveState(); renderPanel(); renderGrid();
}

  attachWorkerToggles('mw');
  if(activeMultiTab==='attivita') wireActivitySubtaskToggle('mf', 'mf-tipo');
  document.getElementById('saveMultiBtn').addEventListener('click', saveMultiEntry);
}

function saveMultiEntry(){
  if(selectedMultiBlocks.size < 1){ flashStatus('Select at least one block'); return; }
  const blocks = state.blocks.filter(b=>selectedMultiBlocks.has(b.id));
  const hasHa = blocks.some(b=>b.ha);
  const totalHa = hasHa ? blocks.reduce((s,b)=>s+(b.ha||0),0) : blocks.length;
  const date = document.getElementById('mf-date').value || todayISO();
  const note = (document.getElementById('mf-note')?.value || '').trim();
  const groupId = uid();
  const groupBlockNames = blocks.map(b=>b.name);
  const workersTotal = collectWorkers('mw');

  let tipo, subtasks;
  tipo = document.getElementById('mf-tipo').value;
  if(ACTIVITY_SUBTASKS[tipo]){
    const collected = collectActivitySubtasks('mf');
    if(collected.length) subtasks = collected;
  }

  blocks.forEach(b=>{
    const blockHa = hasHa ? (b.ha||0) : 1;
    const share = totalHa ? (blockHa/totalHa) : (1/blocks.length);
    const split = { groupId, blockNames: groupBlockNames, totalHa: +totalHa.toFixed(2), blockHa: hasHa ? b.ha : null, sharePct: +(share*100).toFixed(1) };
    let entry = { id: uid(), type: activeMultiTab, date, note, split };
    entry.workers = workersTotal.map(w=>({ name:w.name, type:w.type, ore: w.ore!=null ? +(w.ore*share).toFixed(2) : null, groupTotalOre: w.ore }));
    entry.tipo = tipo;
    if(subtasks) entry.subtasks = subtasks;
    b.entries.push(entry);
  });
  saveState();
  flashStatus(`Saved to ${blocks.length} blocks (split by hectare)`);
  closeMulti();
  renderGrid();
}

/* ---------- Log / report view ---------- */
function buildRows(){
  const rows = [];
  state.blocks.forEach(b=>{
    b.entries.forEach(e=>{
      const type = e.type==='attivita' ? 'Activity' : 'Phenology';
      const subtasks = e.subtasks || e.pruningTasks;
      const activity = e.type==='attivita' ? (e.tipo + (subtasks && subtasks.length ? ` (${subtasks.join(', ')})` : '')) : e.stadio;
      const splitLabel = e.split ? `${e.split.sharePct}% of ${e.split.blockNames.length}-block group` : '';
      if(e.type==='fenologia'){
        rows.push({ Date:e.date, Block:b.name, Variety:b.variety||'', Ha:b.ha||'', Type:type, Activity:activity, Operator:e.osservatoDa||'', OperatorType:'', Hours:'', Split:splitLabel, Note:e.note||'' });
      } else if(e.workers && e.workers.length){
        e.workers.forEach(w=>{
          rows.push({ Date:e.date, Block:b.name, Variety:b.variety||'', Ha:b.ha||'', Type:type, Activity:activity, Operator:w.name, OperatorType:typeLabel(w.type), Hours:w.ore, Split:splitLabel, Note:e.note||'' });
        });
      } else {
        rows.push({ Date:e.date, Block:b.name, Variety:b.variety||'', Ha:b.ha||'', Type:type, Activity:activity, Operator:'', OperatorType:'', Hours:'', Split:splitLabel, Note:e.note||'' });
      }
    });
  });
  rows.sort((a,c)=> c.Date.localeCompare(a.Date));
  return rows;
}

function openLog(){
  logFilterBlock = 'all'; logFilterCategory = 'all';
  renderLogPanel();
  document.getElementById('logOverlay').classList.add('open');
}
function closeLog(){ document.getElementById('logOverlay').classList.remove('open'); }

function renderLogPanel(){
  const panel = document.getElementById('logPanel');
  const blockOptions = state.blocks.map(b=>`<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)}</option>`).join('');
  panel.innerHTML = `
    <div class="filter-row">
      <select id="logBlockFilter"><option value="all">All blocks</option>${blockOptions}</select>
      <select id="logCatFilter">
        <option value="all">All types</option>
        <option value="Activity">Activity</option>
        <option value="Phenology">Phenology</option>
      </select>
      <button class="tool-btn primary" id="logExportBtn">⬇ Export Excel</button>
      <span class="log-count" id="logCount"></span>
    </div>
    <div class="log-table-wrap" id="logTableWrap"></div>
  `;
  document.getElementById('logBlockFilter').value = logFilterBlock;
  document.getElementById('logCatFilter').value = logFilterCategory;
  document.getElementById('logBlockFilter').addEventListener('change', e=>{ logFilterBlock = e.target.value; renderLogTable(); });
  document.getElementById('logCatFilter').addEventListener('change', e=>{ logFilterCategory = e.target.value; renderLogTable(); });
  document.getElementById('logExportBtn').addEventListener('click', exportExcel);
  renderLogTable();
}

function renderLogTable(){
  const wrap = document.getElementById('logTableWrap');
  let rows = buildRows();
  if(logFilterBlock !== 'all') rows = rows.filter(r=>r.Block===logFilterBlock);
  if(logFilterCategory !== 'all') rows = rows.filter(r=>r.Type===logFilterCategory);
  document.getElementById('logCount').textContent = `${rows.length} entries`;
  if(!rows.length){ wrap.innerHTML = '<div class="log-empty">No entries match this filter.</div>'; return; }
  wrap.innerHTML = `
    <table class="log-table">
      <thead><tr>
        <th>Date</th><th>Block</th><th>Variety</th><th>Type</th><th>Activity</th>
        <th>Operator</th><th>Op. Type</th><th>Hours</th><th>Split</th><th>Note</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${formatDate(r.Date)}</td>
            <td>${escapeHtml(r.Block)}</td>
            <td>${escapeHtml(r.Variety)}</td>
            <td>${escapeHtml(r.Type)}</td>
            <td>${escapeHtml(r.Activity||'')}</td>
            <td>${escapeHtml(r.Operator||'')}</td>
            <td>${escapeHtml(r.OperatorType||'')}</td>
            <td>${r.Hours===''||r.Hours==null?'':r.Hours}</td>
            <td class="wrap-cell">${escapeHtml(r.Split||'')}</td>
            <td class="wrap-cell">${escapeHtml(r.Note||'')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

/* ---------- Excel export ---------- */
function exportExcel(){
  if(typeof XLSX === 'undefined'){ flashStatus('Excel library unavailable'); return; }
  const rows = buildRows();
  if(!rows.length){ flashStatus('No data to export'); return; }

  const activityRows = rows.filter(r=>r.Type==='Activity').map(r=>({
    Date: r.Date, Block: r.Block, Variety: r.Variety, Ha: r.Ha, Activity: r.Activity,
    Operator: r.Operator, 'Operator Type': r.OperatorType, Hours: r.Hours, 'Split Allocation': r.Split, Note: r.Note
  }));
  const monitoringRows = rows.filter(r=>r.Type==='Phenology').map(r=>({
    Date: r.Date, Block: r.Block, Variety: r.Variety, 'Growth Stage': r.Activity, 'Observed By': r.Operator, Note: r.Note
  }));

  if(!activityRows.length && !monitoringRows.length){ flashStatus('No data to export'); return; }

  const wb = XLSX.utils.book_new();
  if(activityRows.length){
    const ws1 = XLSX.utils.json_to_sheet(activityRows);
    ws1['!autofilter'] = { ref: ws1['!ref'] };
    ws1['!cols'] = [{wch:11},{wch:8},{wch:20},{wch:6},{wch:26},{wch:16},{wch:13},{wch:7},{wch:24},{wch:32}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Field Log');
  }
  if(monitoringRows.length){
    const ws2 = XLSX.utils.json_to_sheet(monitoringRows);
    ws2['!autofilter'] = { ref: ws2['!ref'] };
    ws2['!cols'] = [{wch:11},{wch:8},{wch:20},{wch:42},{wch:16},{wch:32}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Monitoring');
  }
  XLSX.writeFile(wb, `wayfinder-field-log-${todayISO()}.xlsx`);
  flashStatus('Excel exported — add rates in your costing sheet to calculate $');
}

/* ---------- Wiring ---------- */
document.getElementById('search').addEventListener('input', renderGrid);
document.getElementById('syncBtn').addEventListener('click', ()=>syncNow(true));
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsCloseBtn').addEventListener('click', closeSettings);
document.getElementById('multiBtn').addEventListener('click', openMulti);
document.getElementById('multiCloseBtn').addEventListener('click', closeMulti);
document.getElementById('logBtn').addEventListener('click', openLog);
document.getElementById('logCloseBtn').addEventListener('click', closeLog);
document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('settingsOverlay').addEventListener('click', (e)=>{ if(e.target.id==='settingsOverlay') closeSettings(); });
document.getElementById('multiOverlay').addEventListener('click', (e)=>{ if(e.target.id==='multiOverlay') closeMulti(); });
document.getElementById('logOverlay').addEventListener('click', (e)=>{ if(e.target.id==='logOverlay') closeLog(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeModal(); closeSettings(); closeMulti(); closeLog(); } });

loadState();
</script>
